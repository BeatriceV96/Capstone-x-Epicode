<div *ngIf="notifications.length > 0" class="absolute right-0 mt-2 bg-white text-black rounded shadow-lg">
  <ul>
    <li *ngFor="let notification of notifications" class="p-2 hover:bg-gray-200 cursor-pointer"
        (click)="goToNotification(notification)">
      {{ notification.message }}
    </li>
  </ul>
</div>
